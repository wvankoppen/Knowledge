<script type="module">
    const answerGenerator = function* (q) {
        console.log(`.answerGenerator(q='${q})`);
        let answerForQuestion = 'answer for ' + q;
        let question = yield answerForQuestion;
        answerForQuestion = `next answer for ${question}!`;
        yield answerForQuestion;
        console.log('yield', question);
    };

    const answers = answerGenerator('first question');

    console.log('second reply:', answers.next('second question'));
    console.log('third reply:', answers.next('third question'));
    console.log('fourth reply:', answers.next('fourth question'));
</script>
